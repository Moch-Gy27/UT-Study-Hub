berikan Allah SWT dan harus dijaga melalui iman, ilmu, amal baik, serta penghormatan terhadap sesama.`,`Topik ini tidak dapat diterapkan dalam situasi nyata.`],correct:0},{q:`Saat menemukan kasus yang berkaitan dengan filsafat ketuhanan, langkah belajar yang tepat adalah…`,a:[`Kenali konsepnya, lihat unsur yang terlibat, lalu hubungkan dengan situasi tersebut.`,`Langsung mengambil kesimpulan tanpa membaca informasi.`,`Mengabaikan konteks dan hanya menghafal istilah.`,`Menggantinya dengan pembahasan yang tidak berkaitan.`],correct:0},{q:`Mengapa filsafat ketuhanan perlu dipelajari dalam modul Berketuhanan Yang Maha Esa?`,a:[`Karena konsep ini membantu memahami dan menerapkan pokok bahasan berketuhanan yang maha esa.`,`Karena hanya digunakan untuk mengisi daftar isi.`,`Karena tidak mempunyai hubungan dengan tujuan modul.`,`Karena menggantikan seluruh kegiatan belajar lainnya.`],correct:0}]},{title:`Keimanan dan Ketakwaan`,sourcePage:10,intro:`Iman adalah keyakinan yang dibenarkan dalam hati, diucapkan, dan diwujudkan dalam perbuatan; takwa berarti menjalankan perintah Allah SWT dan menjauhi larangan-Nya.`,sections:[{title:`Bahasa gampangnya`,body:`Iman adalah keyakinan yang dibenarkan dalam hati, diucapkan, dan diwujudkan dalam perbuatan; takwa berarti menjalankan perintah Allah SWT dan menjauhi larangan-Nya.`},{title:`Hal yang perlu kamu ingat`,body:`• Kata kunci: keimanan dan ketakwaan.
